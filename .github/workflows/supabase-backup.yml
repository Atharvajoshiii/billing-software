name: Encrypted Supabase database backup

on:
  workflow_dispatch:
  schedule:
    # 03:00 Asia/Kolkata daily.
    - cron: "30 21 * * *"

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Install age
        run: sudo apt-get update && sudo apt-get install --yes age
      - name: Create encrypted database export
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
        run: ./scripts/backup-supabase.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ledgerwise-supabase-backup-${{ github.run_id }}
          path: .backups/supabase/
          if-no-files-found: error
          retention-days: 30
